project:
  type: website
  output-dir: _site
  resources:
    - data/*.json

website:
  title: "Vaccine Assay Pipeline"
  description: "SYNTHETIC vaccine-trial assay data through a mini-LIMS, 4PL ELISA curves, plate QC and a detection scorecard."
  site-url: "https://michaelh117.github.io/vaccine-assay-pipeline/"
  page-navigation: true
  favicon: assets/favicon.svg
  bread-crumbs: false
  navbar:
    title: "Vaccine Assay Pipeline"
    collapse-below: lg
    left:
      - href: index.qmd
        text: Overview
      - href: results.qmd
        text: Vaccine results
      - href: tube.qmd
        text: Follow one tube
      - href: qc.qmd
        text: Lab QC
      - href: scorecard.qmd
        text: Problems caught
      - href: glossary.qmd
        text: Glossary
      - href: about.qmd
        text: How it works
  page-footer:
    left: "SYNTHETIC data only. A demonstration, not a validated system."
    center: '<span class="hl-lockup"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M4 12V4H12M52 4H60V12M60 52V60H52M12 60H4V52" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16V48M16 32H36M36 16V48H47" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="square"/><circle class="hl-dot" cx="47" cy="21" r="4.6"/></svg><span>A <b>Hanson Labs</b> project</span></span>'
    right: "Built with Quarto + Observable Plot from `docs/results.json` and `data/marts`."

format:
  html:
    theme:
      light: [cosmo, theme.scss, theme-light.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: full
    smooth-scroll: false
    link-external-newwindow: true
    anchor-sections: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
          <script src="assets/icons.js"></script>
    include-before-body: _banner.html
    code-copy: false
    include-after-body:
      - text: '<script src="assets/site.js" defer></script><script src="assets/story.js" defer></script><script src="assets/specimen.js" defer></script>'
    css: [assets/site.css, assets/specimen.css]
